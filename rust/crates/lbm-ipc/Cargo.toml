[package]
name = "lbm-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "LittleBigMouse local IPC: length-prefixed framing and the XML command/event protocol"

[dependencies]
roxmltree.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

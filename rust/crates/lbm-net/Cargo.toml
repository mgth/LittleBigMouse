[package]
name = "lbm-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "LittleBigMouse multi-PC network: machine identity, mutual TLS, pairing store, frames and control messages"

[dependencies]
# The input stream vocabulary and the screens a remote reports (docs/multi-pc.md).
lbm-ipc = { path = "../lbm-ipc" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The send buffer of a link kept small (`link::SEND_BUFFER`); already in the graph via tokio.
socket2 = "0.6"
# The crypto provider is ring, chosen explicitly everywhere, rather than rustls's
# default aws-lc-rs: aws-lc needs CMake and NASM to build for Windows, ring only a C
# compiler. Default features are off so that aws-lc never comes back through one of
# them, and TLS 1.2 is left out because both ends are ours and speak 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

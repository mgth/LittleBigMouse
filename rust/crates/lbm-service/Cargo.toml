[package]
name = "lbm-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Windows service of the multi-PC mode: injects a master's input on the secure desktop and above the user's windows"

[dependencies]
lbm-admin-only = { path = "../lbm-admin-only" }
# The link masters speak to the service on, as to a remote's agent.
lbm-net = { path = "../lbm-net" }
lbm-ipc = { path = "../lbm-ipc" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true

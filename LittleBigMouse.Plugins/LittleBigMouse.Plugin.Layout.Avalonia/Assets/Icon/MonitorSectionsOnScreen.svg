<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   id="svgMonitorSectionsOnScreen"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Deliberately monochrome, unlike MonitorBorderResistance.svg which carries a
       #0078d7 screen fill: this one is a toggle glyph, so it has to follow the
       theme. Full black swaps to the theme foreground.

       Geometry note: the 9-wide stroke is centred on the rect path, so the screen
       really spans 5.5..118.5 and its INNER right edge is at 109.5. The band has to
       stay under that, or it juts out past the monitor. -->

  <!-- Screen: path 10..114 x 20..92, outer 5.5..118.5 x 15.5..96.5, centre x = 62 -->
  <rect
     style="fill:none;stroke:#000000;stroke-width:9;stroke-linejoin:round"
     width="104"
     height="72"
     x="10"
     y="20"
     ry="10" />

  <!-- Stand, centred under the screen -->
  <rect
     style="fill:#000000"
     width="32"
     height="10"
     x="46"
     y="98"
     ry="5" />

  <!-- The walled-off stretch of the right edge — what the button shows on the
       screens. Inside the frame (91..109) and vertically centred (38..74). -->
  <rect
     style="fill:#000000"
     width="18"
     height="36"
     x="91"
     y="38"
     ry="5" />
</svg>

# Build LittleBigMouse. What Windows ships is the Rust workspace only (x64): the
# window, the agent, the hook, the input service and its injector. The C# sources are
# no longer packaged; their tests still run.
# - Push / PR on master or v6 (the integration branch of the three-process
#   architecture, docs/v6-architecture-plan.md on that branch): run the suites,
#   build everything (installer included, as a smoke test), upload a portable
#   artifact. The Rust hook is also checked on Linux, where its evdev, portal and
#   X11 backends live and which the Windows job never compiles.
# - Tag v*: additionally publish the installer as an artifact and attach it to a
#   draft GitHub release for manual review before publishing.
#
# Releases are Authenticode-signed by SignPath Foundation when the SignPath
# variables are configured; see SIGNING.md. Until they are, the tag build keeps
# drafting the unsigned release exactly as before, so merging this cannot strand a
# release behind an approval that has not landed yet.

name: Build

on:
  push:
    branches: [ "master", "v6" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "v6" ]
  workflow_dispatch:

env:
  HOOK_RUST_PROJECT: rust\Cargo.toml
  # The whole Windows package, and nothing else: the portable artifact, the signing
  # input and what the installer reads (SourceDir's default) are this folder.
  STAGE: artifacts\windows

jobs:
  # The Rust workspace on Linux: the only place the hook's evdev/uinput, portal
  # and X11 backends are compiled, and the target most of its day-to-day testing
  # happens on. None of its tests need a display, /dev/input or /dev/uinput. The
  # toolchain comes from rust-toolchain.toml. Clippy is a gate here and in the
  # Windows job, each on the code its platform compiles.
  rust-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Format
      run: cargo fmt --check

    # The reference snapshots of `lbm-ui` render through wgpu, and a runner has no GPU.
    # lavapipe is Mesa's software Vulkan device; `mesa-vulkan-drivers` is what ships it.
    # Nothing else in the workspace needs it — every other test asks the accessibility
    # tree — so a runner without it would still pass everything but the snapshots.
    - name: Software Vulkan for the reference snapshots
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers

    # One test at a time. The test binaries that render through lavapipe die at random
    # with a SIGSEGV when their tests run side by side on this runner: never at the same
    # test, never with an assertion, and not on a newer Mesa. The cause is not established;
    # this removes the concurrency they share, for a few seconds of test time.
    - name: Test
      env:
        RUST_TEST_THREADS: "1"
      run: cargo test

    # What the render actually produced, when it did not match. Without this a snapshot
    # failure is a number of differing pixels and nothing to look at — and looking is the
    # entire point of having rendered.
    - name: Upload the snapshots that did not match
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-diffs
        path: rust/crates/lbm-ui/tests/snapshots/**
        if-no-files-found: ignore

    # Benches are plain binaries nothing else builds; keep them compiling.
    - name: Build benches
      run: cargo bench --no-run

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Derive version from tag
      id: ver
      run: |
        if ("${{ github.ref }}" -like "refs/tags/v*") {
          $v = "${{ github.ref_name }}" -replace '^v',''
        } else {
          $v = ""
        }
        "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Release version: '$v'"

    # Before anything is built for shipping: a red suite should cost seconds, not
    # a full installer run.
    - name: Test (managed)
      run: dotnet test LittleBigMouse.sln -c Release --nologo

    - name: Test (Rust hook)
      run: cargo test --manifest-path $env:HOOK_RUST_PROJECT

    # The Win32 half of the hook only compiles here. Linted natively rather than
    # cross-linted from the Linux job: `--all-targets` builds criterion's C
    # dependencies, which want a MinGW compiler the Linux runner does not have.
    - name: Clippy (Rust, Windows)
      run: cargo clippy --manifest-path $env:HOOK_RUST_PROJECT --all-targets -- -D warnings

    # windows-latest ships a stable Rust toolchain preinstalled, so no install step.
    # LBM_VERSION is what the build scripts stamp into each exe's version resource:
    # off a tag it stays empty and they fall back to Directory.Build.props.
    - name: Build (Rust, release)
      env:
        LBM_VERSION: ${{ steps.ver.outputs.version }}
      run: cargo build --release --manifest-path $env:HOOK_RUST_PROJECT

    # An empty folder filled by name, so that nothing a build happened to leave
    # behind can be packaged, or sent to be signed.
    - name: Stage the package
      run: |
        if (Test-Path $env:STAGE) { Remove-Item -Recurse -Force $env:STAGE }
        New-Item -ItemType Directory -Force $env:STAGE | Out-Null
        # Cargo can't emit a target named with a '.', so the hook is built as
        # lbm-hook.exe and renamed to the name the agent looks for here.
        $binaries = [ordered]@{
          'lbm-app.exe'     = 'lbm-app.exe'
          'lbm-agent.exe'   = 'lbm-agent.exe'
          'lbm-hook.exe'    = 'LittleBigMouse.Hook.exe'
          # The multi-PC input service and the injector it launches
          # (docs/multi-pc-service-windows.md). In the portable too, where nothing
          # installs them: the installer creates the service only when its task is
          # ticked, and the service runs only from a folder administrators alone can
          # change.
          'lbm-service.exe' = 'lbm-service.exe'
          'lbm-inject.exe'  = 'lbm-inject.exe'
        }
        foreach ($built in $binaries.Keys) {
          Copy-Item (Join-Path 'rust\target\release' $built) (Join-Path $env:STAGE $binaries[$built])
        }
        # lbm-app reads its pictures (manufacturer logos under Icon/Pnp, the LBM
        # ones) from an icons folder beside its exe (`icons_root`). Without this, an
        # installed or portable lbm-app draws the screen map with no logo. The Dell
        # logo stands for the tree: present at its path, the layout `icons_root`
        # expects is too.
        $icons = Join-Path $env:STAGE 'icons'
        Copy-Item -Recurse LittleBigMouse.Ui\LittleBigMouse.Ui.Avalonia\Assets $icons
        $dell = Join-Path $icons 'Icon\Pnp\Dell.DEL.DLL.svg'
        if (-not (Test-Path -LiteralPath $dell)) { throw "missing ${dell}: lbm-app would draw no manufacturer logo" }

    # A build script that cannot embed its resource only warns, and a nameless exe
    # still builds and still runs. SignPath constrains the product name and version of
    # every file it signs (SIGNING.md), so assert on the staged files themselves.
    - name: Verify version resources
      run: |
        $version = "${{ steps.ver.outputs.version }}"
        if (-not $version) { $version = ([xml](Get-Content Directory.Build.props -Raw)).SelectNodes('//Version')[0].InnerText.Trim() }
        # Each exe has its own: lbm-inject is built in the hook's package, and would
        # otherwise carry the hook's name.
        $names = 'lbm-app.exe', 'lbm-agent.exe', 'LittleBigMouse.Hook.exe', 'lbm-service.exe', 'lbm-inject.exe'
        foreach ($name in $names) {
          $info = (Get-Item (Join-Path $env:STAGE $name)).VersionInfo
          if ($info.ProductName -ne 'Little Big Mouse') {
            throw "$name ProductName is '$($info.ProductName)', expected 'Little Big Mouse'"
          }
          if ($info.FileVersion -ne $version) { throw "$name FileVersion is '$($info.FileVersion)', expected '$version'" }
          if ($info.ProductVersion -ne $version) { throw "$name ProductVersion is '$($info.ProductVersion)', expected '$version'" }
          if ($info.OriginalFilename -ne $name) { throw "$name OriginalFilename is '$($info.OriginalFilename)'" }
          "${name}: $($info.ProductName) $($info.ProductVersion), $($info.FileDescription)"
        }
        # Exactly these programs: no library or third-party binary slips in beside
        # them, where it would be shipped, and offered for signing.
        $found = @(Get-ChildItem $env:STAGE -Recurse -File -Include *.exe, *.dll, *.sys, *.msi | ForEach-Object Name)
        $extra = @($found | Where-Object { $names -notcontains $_ })
        if ($extra.Count -or $found.Count -ne $names.Count) { throw "unexpected binaries in the package: $($found -join ', ')" }

    # A program that imports vcruntime140.dll does not start at all on a Windows
    # that never installed a VC++ redistributable (#539), and every machine that
    # builds it has one — so the break is invisible right up to the user. The
    # static CRT that avoids it is set in .cargo/config.toml, which Cargo
    # resolves from the working directory: moving this build into a crate's own
    # directory, or adding a second config closer to the manifest, silently
    # drops the flag. Read the imports off the artifacts instead of trusting
    # that; a PE names its DLLs in plain ASCII, so no toolchain is needed.
    - name: Verify no VC++ redistributable is needed
      run: |
        foreach ($exe in Get-ChildItem $env:STAGE -Filter *.exe) {
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe.FullName))
          if ($text -match 'VCRUNTIME\d|MSVCP\d') {
            throw "$($exe.Name) imports the MSVC runtime: it will not start where no VC++ redistributable was ever installed (#539)"
          }
          "$($exe.Name): statically linked"
        }

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-portable
        path: ${{ env.STAGE }}
        if-no-files-found: error

    # Compiled on every build, not only on tags: the installer script breaks in ways
    # the app build can't catch (ISCC aborts on a file missing from the stage), and a
    # release tag
    # is far too late to find out. Costs a few seconds. Only the two publishing
    # steps below stay tag-only.
    - name: Compile installer (InnoSetup)
      run: |
        # Off a release tag there is no version to inject. Leave AppVer undefined
        # instead of passing an empty one (ISCC rejects an empty AppVersion) and let
        # the .iss fall back to the built exe's FileVersion.
        $defines = @()
        if ("${{ steps.ver.outputs.version }}") { $defines += "/DAppVer=${{ steps.ver.outputs.version }}" }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @defines LittleBigMouse.Setup\LittleBigMouse.iss
        # Also fails the step if ISCC somehow reported success without producing it.
        Get-ChildItem LittleBigMouse.Setup\LittleBigMouse_*.exe | Select-Object Name, Length

    # Compiling proves little about the [Code] section: install over what a 5.x
    # installation leaves, its logon task included, and uninstall. The runner is
    # thrown away afterwards.
    - name: Test the installer (upgrade from 5.x, uninstall)
      run: |
        $setup = Get-ChildItem LittleBigMouse.Setup\LittleBigMouse_*.exe | Select-Object -First 1
        .\LittleBigMouse.Setup\Test-Installer.ps1 -Setup $setup.FullName

    # On every build, so a branch can be installed and tried on Windows without a
    # tag. Unsigned off a tag: SmartScreen and Smart App Control will say so. Kept two
    # weeks off a tag, the repository default on one.
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-installer
        path: LittleBigMouse.Setup\LittleBigMouse_*.exe
        retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

    # Signing input for the release job below: the same folder as the portable.
    - name: Upload application for release signing
      if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-unsigned-win-x64
        path: ${{ env.STAGE }}
        if-no-files-found: error
        retention-days: 2

    # Only drafts the unsigned installer while SignPath is not configured yet.
    # Once the variables are set the signed release job below owns the draft, and
    # this step stands down so a tag can never produce two drafts.
    - name: Create draft release
      if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG == ''
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        # Name the release with the bare numeric version (not the "v5.3.0" tag): the
        # updater of the C# application (5.x, still installed out there) parses the release name as a Version, and a "v" prefix or a
        # word breaks it (shows "online version 0.0" and blocks the upgrade).
        name: ${{ steps.ver.outputs.version }}
        files: LittleBigMouse.Setup\LittleBigMouse_*.exe
        generate_release_notes: true
        # Default sponsor footer for the draft (shows above the generated notes;
        # keep it when hand-editing the release body).
        body: |
          💜 If Little Big Mouse is useful to you, consider [sponsoring the project](https://github.com/sponsors/mgth).

  # Windows 11 Smart App Control refuses unsigned installers outright, with no
  # "run anyway" to click through (issue #535). Signing gives every release one
  # stable publisher identity, which is what reputation actually accrues to.
  #
  # The installer has to be recompiled here rather than reusing the one the build
  # job made: signing the setup .exe alone would leave the binaries *inside* it
  # unsigned, and those are what Windows checks once they are on disk.
  release:
    name: Sign and draft release
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
    needs: build
    runs-on: windows-latest
    permissions:
      # SignPath reads the run's artifacts to fetch the signing input; the draft
      # release needs write. Nothing else is granted.
      actions: read
      contents: write

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Derive version from tag
      id: ver
      run: |
        $v = "${{ github.ref_name }}" -replace '^v',''
        "version=$v" >> $env:GITHUB_OUTPUT

    - name: Download unsigned application
      uses: actions/download-artifact@v4
      with:
        name: LittleBigMouse-unsigned-win-x64
        path: artifacts\unsigned-app

    # Re-uploaded from this job because the SignPath action signs an artifact of
    # the run it is invoked from, and needs its id.
    - name: Upload application signing input
      id: signing-input-app
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-signing-input-${{ github.run_id }}
        path: artifacts\unsigned-app
        retention-days: 2

    - name: Sign application binaries
      # Pinned by digest, not by tag: this is the one third-party action in the
      # workflow, and the only step that is handed the signing token.
      uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.signing-input-app.outputs.artifact-id }}
        wait-for-completion: true
        # The Foundation release policy gates on a human approving the request,
        # and the action's 10-minute default expires long before that happens.
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: artifacts\signed-app

    # A signing request can come back "successful" having signed nothing that
    # matters, so assert on the executables Windows will actually judge: the window
    # the installer launches (lbm-app), the agent, the hook, and the input service
    # and its injector, which run as LocalSystem.
    - name: Verify signed binaries
      id: signed
      run: |
        $agent = Get-ChildItem artifacts\signed-app -Recurse -Filter lbm-agent.exe | Select-Object -First 1
        if (-not $agent) { throw 'SignPath returned no signed agent' }
        $dir = $agent.Directory.FullName
        $names = 'lbm-app.exe', 'lbm-agent.exe', 'LittleBigMouse.Hook.exe', 'lbm-service.exe', 'lbm-inject.exe'
        foreach ($target in $names | ForEach-Object { Join-Path $dir $_ }) {
          if (-not (Test-Path -LiteralPath $target)) { throw "Missing signed binary: $target" }
          $sig = Get-AuthenticodeSignature -LiteralPath $target
          if ($sig.Status -ne 'Valid') { throw "$target signature: $($sig.StatusMessage)" }
          $publisher = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
          if ($publisher -ne 'SignPath Foundation') { throw "$target signed by '$publisher'" }
        }
        "dir=$dir" >> $env:GITHUB_OUTPUT

    - name: Compile installer from signed binaries
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
          "/DAppVer=${{ steps.ver.outputs.version }}" `
          "/DSourceDir=${{ steps.signed.outputs.dir }}" `
          LittleBigMouse.Setup\LittleBigMouse.iss
        Get-ChildItem LittleBigMouse.Setup\LittleBigMouse_*.exe | Select-Object Name, Length

    - name: Upload installer signing input
      id: signing-input-installer
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-installer-signing-input-${{ github.run_id }}
        path: LittleBigMouse.Setup\LittleBigMouse_*.exe
        retention-days: 2

    - name: Sign installer
      # Pinned by digest, not by tag: this is the one third-party action in the
      # workflow, and the only step that is handed the signing token.
      uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.signing-input-installer.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600
        output-artifact-directory: artifacts\signed-installer

    - name: Verify signed installer
      run: |
        $name = "LittleBigMouse_${{ steps.ver.outputs.version }}.exe"
        $installer = Get-ChildItem artifacts\signed-installer -Recurse -Filter $name | Select-Object -First 1
        if (-not $installer) { throw "SignPath returned no $name" }
        $sig = Get-AuthenticodeSignature -LiteralPath $installer.FullName
        if ($sig.Status -ne 'Valid') { throw "Installer signature: $($sig.StatusMessage)" }
        $publisher = $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
        if ($publisher -ne 'SignPath Foundation') { throw "Installer signed by '$publisher'" }
        New-Item artifacts\release -ItemType Directory -Force | Out-Null
        Copy-Item $installer.FullName "artifacts\release\$name"

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        # Bare numeric version, as in the unsigned path above.
        name: ${{ steps.ver.outputs.version }}
        # The installer and nothing else: the 5.x updater downloads assets[0],
        # so any extra asset sorting ahead of it (an SBOM, a checksum file) would
        # be handed to every existing user as if it were the setup .exe.
        files: artifacts\release\LittleBigMouse_*.exe
        generate_release_notes: true
        body: |
          💜 If Little Big Mouse is useful to you, consider [sponsoring the project](https://github.com/sponsors/mgth).

          The installer and the binaries it carries are Authenticode-signed by SignPath Foundation.

          Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).

[package]
name = "lbm-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Overlay surfaces for the rulers and resistance bands: placed to the pixel on a chosen screen, transparent, click-through"

[[bin]]
name = "lbm-overlay-spike"
path = "src/main.rs"

[dependencies]
lbm-layout = { path = "../lbm-layout" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# The Linux library and standalone spike use native output-bound surfaces on Wayland,
# avoiding XWayland's global coordinate scale on desktops with mixed output scales.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# The X11 back: a placed, override-redirect, 32-bit window with an empty input shape —
# and, unlike Wayland, a server that can be asked back what it granted.
x11rb = { version = "0.14", features = ["shape", "randr", "render"] }
libc = "0.2"

[package]
name = "lbm-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The resident process of LittleBigMouse v6: watches the system, loads the profiles, drives the hook"

[dependencies]
lbm-wallpaper = { path = "../lbm-wallpaper" }
indexmap.workspace = true
lbm-display = { path = "../lbm-display" }
# The edge report (Probe): a pure function of the zones the agent already holds.
lbm-engine = { path = "../lbm-engine" }
lbm-ipc = { path = "../lbm-ipc" }
lbm-layout = { path = "../lbm-layout" }
# The multi-PC network (docs/multi-pc.md): identity, pairing store, links.
lbm-net = { path = "../lbm-net" }
lbm-store = { path = "../lbm-store" }
# The document the hook reads, so the fake hook can decide a Load exactly as the
# daemon does instead of guessing from the text (already in the graph via lbm-engine).
lbm-zones = { path = "../lbm-zones" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The tray icons, rendered once from the UI's SVGs (icons/).
png = "0.17"
# The span wallpaper: decoding whatever the user picked, and writing the slices.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
base64 = "0.22"
aes-gcm = "0.10"
md-5 = "0.10"
sha2 = "0.11"
getrandom = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"
roxmltree = "0.21"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
reqwest = { version = "0.13", default-features = false }

url = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# async-io, never tokio, for zbus and everything that forwards to it (ksni, ashpd): cargo
# unifies features across the packages of one build, and a zbus built for tokio panics in
# lbm-app's accessibility thread (accesskit_unix runs zbus outside any tokio runtime).
# The tray (tray.rs): a StatusNotifierItem over D-Bus, no GTK.
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }
# System sleep from logind (sleep.rs), with the hook's zbus build.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true

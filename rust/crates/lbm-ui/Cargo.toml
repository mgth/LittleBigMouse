[package]
name = "lbm-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The LittleBigMouse frontend (v7): state, actions and views, with no window of its own yet"

[dependencies]
egui = "0.36"
# The layout model the map draws: millimetres, bezels, and the rectangles a monitor
# occupies. The frontend reads the same model the agent computes from.
lbm-layout = { path = "../lbm-layout" }
# The rescue shortcut'''s grammar, shared with the hook that registers it — so what this
# panel lets a user write is exactly what the daemon will accept. Not `lbm-hook`: that
# crate is the one that takes the mice, and this window must never be able to.
lbm-ipc = { path = "../lbm-ipc" }
# The same crate, version and feature set the agent decodes wallpapers with, so the two
# sides of the product cannot disagree about what a picture looks like.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

[dev-dependencies]
egui_kittest = "0.36"
# The oracle's scenario inputs, so the map is exercised on real desktops and not only
# on rectangles chosen by whoever wrote the test.
serde_json.workspace = true
# The frame places the logo; this is what turns a `Logo` string into pixels. A
# dev-dependency because the loading belongs to whoever owns the egui context, not to
# the view — but the two have to be shown to meet.
lbm-icons = { path = "../lbm-icons" }

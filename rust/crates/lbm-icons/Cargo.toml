[package]
name = "lbm-icons"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The icon set: the manufacturer-logo aliases, and recolouring an SVG to the theme without guessing what the caller meant"

[dependencies]
# The parsed tree rather than the text: the C# side substitutes three spellings of
# black in the raw XML, and its own TODO says why that is wrong ("Black might be used
# inside strings"). A tree has fills and strokes, not strings that look like them.
resvg = "0.48"

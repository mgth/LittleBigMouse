[package]
name = "littlebigmouse-hook"
version = "0.1.0"
edition = "2021"
description = "Little Big Mouse hook daemon (Rust port of LittleBigMouse.Hook)"
license = "GPL-3.0-only"

# The C# UI locates and launches the daemon strictly by the exe name
# "LittleBigMouse.Hook.exe" (LittleBigMouseClientService.FindHookPath /
# GetProcessesByName). Cargo cannot emit a target whose name contains '.', so the
# binary is built as `lbm-hook.exe` and renamed to `LittleBigMouse.Hook.exe`
# during staging/packaging (Phase 5 — the CI copy step already does this).
[[bin]]
name = "lbm-hook"
path = "src/main.rs"

# Native-Wayland fullscreen bitmap viewer: pixel-perfect test patterns on every
# output (the Avalonia windows go through XWayland, which KWin rescales on any
# screen whose scale differs from the global factor). Linux-only, stub elsewhere.
[[bin]]
name = "lbm-pattern"
path = "src/bin/lbm-pattern.rs"

[lib]
name = "littlebigmouse_hook"
path = "src/lib.rs"

[dependencies]
roxmltree = "0.20"
slotmap = "1"
# Local IPC server (named pipe / UDS): async accept loop, bounded queues.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Embeds the VERSIONINFO resource (see build.rs). Not under a
# [target.'cfg(windows)'] table on purpose: build-dependencies are resolved
# against the *host*, so gating it that way would break a Linux host
# cross-compiling to Windows. build.rs decides at run time instead, on
# CARGO_CFG_TARGET_OS, and does nothing off Windows.
[build-dependencies]
winresource = "0.1.31"
# Reads <Version> out of Directory.Build.props. A substring search is not enough:
# that file mentions "<Version>" inside its own comment, ahead of the real element.
roxmltree = "0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
]

# Benchmarks only. `default-features = false` drops plotters/rayon and the HTML
# report generator: the baseline this repo keeps is the textual one, and the
# daemon has no use for a heavier dev tree.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# The traversal engine's hot path, measured against a fake cursor.
[[bench]]
name = "mouse_engine"
harness = false

# Allocation counts for the same scenarios. A plain binary rather than a
# criterion harness: allocation counts are deterministic, so they are reported
# as exact figures instead of being sampled.
[[bench]]
name = "alloc_profile"
harness = false

# The Linux evdev pump's per-report plumbing: poll set, event drain, routing and
# frame composition, with the buffers the Router owns and against the per-cycle
# allocation that preceded them. No device, no /dev/uinput; prints a line and
# exits off Linux.
[[bench]]
name = "evdev_pump"
harness = false

# The mouse-hook hot path: dedup, non-blocking try_lock route, dispatch — the
# neutral core (hook::hot_path) the Windows callback is a shim over, measured
# per branch (dedup / passthrough / crossing / contended). A plain binary, like
# alloc_profile: the per-event allocation counts are exact and asserted to be 0
# on the ordinary paths. No hook, no device, no real cursor.
[[bench]]
name = "mouse_hook"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Preferred Wayland (and X11) backend: grab the physical mice and re-inject a
# corrected stream through a uinput virtual pointer — LBM is the sole router,
# like the Windows hook. No portal, no capture notification, no round-trip.
evdev = "0.13"
# "res" (X-Resource) resolves the pid of clients that do not set _NET_WM_PID
# (focus watcher / process exclusion).
x11rb = { version = "0.13", features = ["xinput", "randr", "res"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture", "tracing"] }
# Already in the tree through ashpd; used directly by the evdev backend to ask
# KWin for the real cursor position (scripting API) when arming.
zbus = { version = "5", default-features = false, features = ["tokio"] }
reis = { version = "0.7", features = ["tokio"] }
futures = "0.3"
# Portal signal diagnostics: ashpd traces every InputCapture signal it receives
# (and, crucially, bodies it fails to deserialize and silently drops).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# lbm-pattern: bare Wayland client (wl_shm buffer + xdg_toplevel fullscreen +
# wp_viewport so the native-resolution buffer maps 1:1 to the panel).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
png = "0.17"

# Build LittleBigMouse: managed UI (net10 / Avalonia) + native hook daemon (x64,
# Rust by default, C++ as opt-out).
# - Push / PR on master: run the suites, build everything (installer included, as
#   a smoke test), upload a portable artifact.
# - Tag v*: additionally publish the installer as an artifact and attach it to a
#   draft GitHub release for manual review before publishing.

name: Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      hook_impl:
        description: 'Hook daemon implementation to build and ship'
        default: 'rust'
        type: choice
        options: [ rust, cpp ]

env:
  # Which hook daemon to build/stage. The Rust port is the default on every
  # build; the C++ implementation stays available as an opt-out via
  # workflow_dispatch while it remains in the tree.
  HOOK_IMPL: ${{ github.event.inputs.hook_impl || 'rust' }}
  UI_PROJECT: LittleBigMouse.Ui\LittleBigMouse.Ui.Avalonia\LittleBigMouse.Ui.Avalonia.csproj
  HOOK_PROJECT: LittleBigMouse.Hook\LittleBigMouse.Hook.vcxproj
  HOOK_RUST_PROJECT: LittleBigMouse-Hook-Rust\Cargo.toml
  UI_OUTPUT: LittleBigMouse.Ui\LittleBigMouse.Ui.Avalonia\bin\x64\Release\net10.0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Derive version from tag
      id: ver
      run: |
        if ("${{ github.ref }}" -like "refs/tags/v*") {
          $v = "${{ github.ref_name }}" -replace '^v',''
        } else {
          $v = ""
        }
        "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Release version: '$v'"

    # Before anything is built for shipping: a red suite should cost seconds, not
    # a full installer run.
    #
    # Through the filter rather than the solution, which still holds the C++ hook:
    # `dotnet` cannot load a .vcxproj without the MSVC toolchain and fails the run
    # over it, so the suites that did work were reported green under a failing
    # build — and the UI suite, which the C++ project used to drag in, never ran at
    # all. Being run by nobody is how a test comes to be trusted for nothing.
    - name: Test (managed)
      run: dotnet test LittleBigMouse-Managed.slnf -c Release --nologo

    - name: Test (Rust hook)
      run: cargo test --manifest-path $env:HOOK_RUST_PROJECT

    - name: Build UI (net10, x64 Release)
      run: |
        $buildArgs = @('-c','Release','-p:Platform=x64')
        if ("${{ steps.ver.outputs.version }}") { $buildArgs += "-p:Version=${{ steps.ver.outputs.version }}" }
        dotnet build $env:UI_PROJECT @buildArgs

    - name: Build hook (C++, x64 Release)
      if: env.HOOK_IMPL == 'cpp'
      run: msbuild $env:HOOK_PROJECT /m /p:Configuration=Release /p:Platform=x64

    # windows-latest ships a stable Rust toolchain preinstalled, so no install step.
    - name: Build hook (Rust, release)
      if: env.HOOK_IMPL == 'rust'
      run: cargo build --release --manifest-path $env:HOOK_RUST_PROJECT

    - name: Stage hook next to UI output
      # Cargo can't emit a target named with a '.', so the Rust binary is built as
      # lbm-hook.exe and renamed to the contract name here.
      run: |
        if ($env:HOOK_IMPL -eq 'rust') {
          Copy-Item LittleBigMouse-Hook-Rust\target\release\lbm-hook.exe (Join-Path $env:UI_OUTPUT 'LittleBigMouse.Hook.exe')
        } else {
          Copy-Item LittleBigMouse.Hook\bin\x64\Release\LittleBigMouse.Hook.exe $env:UI_OUTPUT\
        }

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-portable
        path: |
          ${{ env.UI_OUTPUT }}
          !${{ env.UI_OUTPUT }}\runtimes\linux*\**
          !${{ env.UI_OUTPUT }}\runtimes\osx*\**

    # Compiled on every build, not only on tags: the installer script breaks in ways
    # the app build can't catch (ISCC aborts on a wildcard matching nothing, so
    # dropping the last file of a kind from the output is enough), and a release tag
    # is far too late to find out. Costs a few seconds. Only the two publishing
    # steps below stay tag-only.
    - name: Compile installer (InnoSetup)
      run: |
        # Off a release tag there is no version to inject. Leave AppVer undefined
        # instead of passing an empty one (ISCC rejects an empty AppVersion) and let
        # the .iss fall back to the built exe's FileVersion.
        $defines = @("/DHookImpl=${{ env.HOOK_IMPL }}")
        if ("${{ steps.ver.outputs.version }}") { $defines += "/DAppVer=${{ steps.ver.outputs.version }}" }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @defines LittleBigMouse.Setup\LittleBigMouse.iss
        # Also fails the step if ISCC somehow reported success without producing it.
        Get-ChildItem LittleBigMouse.Setup\LittleBigMouse_*.exe | Select-Object Name, Length

    - name: Upload installer artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: LittleBigMouse-installer
        path: LittleBigMouse.Setup\LittleBigMouse_*.exe

    - name: Create draft release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        # Name the release with the bare numeric version (not the "v5.3.0" tag): the
        # in-app updater parses the release name as a Version, and a "v" prefix or a
        # word breaks it (shows "online version 0.0" and blocks the upgrade).
        name: ${{ steps.ver.outputs.version }}
        files: LittleBigMouse.Setup\LittleBigMouse_*.exe
        generate_release_notes: true
        # Default sponsor footer for the draft (shows above the generated notes;
        # keep it when hand-editing the release body).
        body: |
          💜 If Little Big Mouse is useful to you, consider [sponsoring the project](https://github.com/sponsors/mgth).
